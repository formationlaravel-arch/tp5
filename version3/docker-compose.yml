name: mpin-ecommerce-v3
services:
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET:-local-compose-demo-secret-change-before-deploy-2026}
      LOG_SERVICE_URL: http://log-service:8080/events
    networks: [backend]
    depends_on:
      log-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  log-service:
    build:
      context: .
      dockerfile: log-service/Dockerfile
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    environment:
      DB_HOST: order-db
      DB_NAME: orders_db
      DB_USER: orders_app
      DB_PASSWORD: ${ORDER_DB_PASSWORD:-orders-demo-password}
      AUTH_URL: http://auth-service:8080
      INVENTORY_URL: http://inventory-service:8080
      PAYMENT_URL: http://payment-service:8080
      DELIVERY_URL: http://delivery-service:8080
      LOG_SERVICE_URL: http://log-service:8080/events
    networks: [backend]
    depends_on:
      order-db: { condition: service_healthy }
      auth-service: { condition: service_healthy }
      inventory-service: { condition: service_healthy }
      payment-service: { condition: service_healthy }
      delivery-service: { condition: service_healthy }
      log-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    environment:
      DATABASE_URL: postgresql://inventory_app:${INVENTORY_DB_PASSWORD:-inventory-demo-password}@inventory-db:5432/inventory_db
      AUTH_URL: http://auth-service:8080
      LOG_SERVICE_URL: http://log-service:8080/events
    networks: [backend]
    depends_on:
      inventory-db: { condition: service_healthy }
      auth-service: { condition: service_healthy }
      log-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    environment:
      AUTH_URL: http://auth-service:8080
      LOG_SERVICE_URL: http://log-service:8080/events
      PAYMENT_DB: /data/payments.sqlite
    volumes:
      - payment-data:/data
    networks: [backend]
    depends_on:
      auth-service: { condition: service_healthy }
      log-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  delivery-service:
    build:
      context: .
      dockerfile: delivery-service/Dockerfile
    environment:
      AUTH_URL: http://auth-service:8080
      LOG_SERVICE_URL: http://log-service:8080/events
      DELIVERY_DB: /data/deliveries.sqlite
    volumes:
      - delivery-data:/data
    networks: [backend]
    depends_on:
      auth-service: { condition: service_healthy }
      log-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  order-db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: orders_db
      MYSQL_USER: orders_app
      MYSQL_PASSWORD: ${ORDER_DB_PASSWORD:-orders-demo-password}
      MYSQL_ROOT_PASSWORD: ${ORDER_DB_ROOT_PASSWORD:-orders-root-demo-password}
    volumes:
      - order-db-data:/var/lib/mysql
      - ./order-service/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    ports:
      - "3307:3306"
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  inventory-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: inventory_app
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:-inventory-demo-password}
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
      - ./inventory-service/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_app -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  backend:
    driver: bridge
    internal: true

volumes:
  order-db-data:
  inventory-db-data:
  payment-data:
  delivery-data:
